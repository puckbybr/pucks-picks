name: Fetch Odds
 
on:
  schedule:
    - cron: '0 13 * * *'   # 8AM ET
    - cron: '0 23 * * *'   # 6PM ET
  workflow_dispatch:         # Manual trigger
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch odds and save to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');
 
          const ODDS_KEY    = '3b6575443e2403327658322a07460ebc';
          const GIST_ID     = 'aa152fd88a987e42a009b7a5686690a1';
          const GIST_TOKEN  = process.env.GIST_TOKEN;
 
          // Active sports based on today's date
          const d     = new Date();
          const month = d.getUTCMonth() + 1;
          const day   = d.getUTCDate();
          const dow   = d.getUTCDay(); // 0=Sun,1=Mon,...,6=Sat
 
          const sports = [];
          if (month >= 9 || month <= 6)                              sports.push('icehockey_nhl');
          if (month === 10)                                           sports.push('baseball_mlb_postseason');
          if (month >= 3  && month <= 9)                             sports.push('baseball_mlb');
          if ((month === 10 && day >= 21) || month >= 11 || month <= 6) sports.push('basketball_nba');
          if ((month >= 9  || month <= 2) && [0,1,4,5,6].includes(dow)) sports.push('americanfootball_nfl');
          if ((month >= 9  || month === 1) && [4,5,6].includes(dow))    sports.push('americanfootball_ncaaf');
          if (month >= 11 || month <= 4)                             sports.push('basketball_ncaab');
 
          console.log('Date:', d.toUTCString());
          console.log('Active sports:', sports.join(', ') || 'none');
 
          function get(url) {
            return new Promise((resolve) => {
              https.get(url, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  if (res.statusCode === 200) resolve(JSON.parse(data));
                  else { console.log('HTTP ' + res.statusCode + ' for ' + url.split('?')[0]); resolve([]); }
                });
              }).on('error', e => { console.log('Error:', e.message); resolve([]); });
            });
          }
 
          function saveGist(content) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({ files: { 'odds.json': { content } } });
              const req = https.request({
                hostname: 'api.github.com',
                path: `/gists/${GIST_ID}`,
                method: 'PATCH',
                headers: {
                  'Authorization': `token ${GIST_TOKEN}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'PucksPicks',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => res.statusCode === 200 ? resolve() : reject('Gist error: ' + res.statusCode + ' ' + d));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }
 
          (async () => {
            const all = [];
            for (const sport of sports) {
              const url = `https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${ODDS_KEY}&regions=us&markets=h2h,totals,spreads&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm,caesars,betrivers`;
              const games = await get(url);
              all.push(...games);
              console.log(sport + ': ' + games.length + ' games');
            }
 
            const etTime = new Date().toLocaleTimeString('en-US', {
              hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'
            }) + ' ET';
 
            await saveGist(JSON.stringify({ games: all, updatedAt: etTime, gameCount: all.length }));
            console.log('Saved ' + all.length + ' games to Gist at ' + etTime);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
 



















