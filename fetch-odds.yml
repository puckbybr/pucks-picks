name: Fetch Odds

on:
  schedule:
    # CORE: 11AM ET daily (all months) — single run in November to conserve credits
    - cron: '0 16 * * *'     # 11AM ET

    # 4PM ET daily — skipped in November (see script guard below)
    - cron: '0 21 * * *'     # 4PM ET

    # SATURDAY 9AM ET (Dec-Feb only: before NCAAFB noon kickoffs)
    - cron: '0 13 * * 6'

    # SUNDAY 10AM ET (Dec-Feb: before 1PM NFL kickoffs)
    - cron: '0 14 * * 0'

    # JUL-AUG EXTRA: 2PM + 7PM ET (MLB freshness, 4 fetches/day)
    - cron: '0 18 * * *'     # 2PM ET
    - cron: '0 23 * * *'     # 7PM ET

    # SEP EXTRA: 6PM ET (NFL/NCAAFB night games)
    - cron: '0 22 * * *'     # 6PM ET

  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch odds and save to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');

          const ODDS_KEY   = '3b6575443e2403327658322a07460ebc';
          const GIST_ID    = 'aa152fd88a987e42a009b7a5686690a1';
          const GIST_TOKEN = process.env.GIST_TOKEN;

          const d     = new Date();
          const month = d.getUTCMonth() + 1;
          const day   = d.getUTCDate();
          const dow   = d.getUTCDay();
          const hour  = d.getUTCHours();

          const sports = [];

          const year = d.getUTCFullYear();

          /* ══════════════════════════════════════════════════════
             NOVEMBER CREDIT CONSERVATION MODE
             Budget: ~62 credits left for Nov 8-30 = 2.8/day max
             Rule: 1 run/day (11AM only), max 3 sports
          ══════════════════════════════════════════════════════ */
          if (month === 11) {
            /* Only allow the 11AM ET run (hour=16 UTC) — skip everything else */
            if (hour !== 16) {
              console.log('November conservation: skipping non-11AM run (hour=' + hour + ')');
              process.exit(0);
            }
            /* November sports: NHL + NBA + NFL (on game days only) — max 3 credits/day */
            sports.push('icehockey_nhl');
            sports.push('basketball_nba');
            /* NFL only on Thu/Fri/Sat/Sun/Mon to avoid wasting a credit on off-days */
            if ([0,1,4,5,6].includes(dow))
              sports.push('americanfootball_nfl');
            /* NCAAFB only on Thu/Fri/Sat */
            if ([4,5,6].includes(dow))
              sports.push('americanfootball_ncaaf');
            /* Cap at 3 sports total */
            sports.splice(3);
            console.log('November conservation mode: ' + sports.join(', '));
          } else {
            /* ── All other months: normal schedule ── */

            /* Extra fetch filters */
            if (hour === 18 && !(month >= 7 && month <= 9)) { console.log('Skipping 2PM — not Jul-Sep'); process.exit(0); }
            if (hour === 23 && !(month >= 7 && month <= 8)) { console.log('Skipping 7PM — not Jul-Aug'); process.exit(0); }
            if (hour === 22 && month !== 9) { console.log('Skipping 6PM — not Sep'); process.exit(0); }

            /* Skip weekend extras outside NFL/NCAAFB season */
            const isWeekendExtra = (dow === 6 && hour === 13) || (dow === 0 && hour === 14);
            const nflNcaafbActive = (month >= 9 || month <= 2);
            if (isWeekendExtra && !nflNcaafbActive) {
              console.log('Skipping weekend extra fetch — NFL/NCAAFB not active');
              process.exit(0);
            }

            /* OCTOBER 2026 CONSERVATION: NHL + MLB postseason only */
            if (month === 10 && year === 2026) {
              sports.push('icehockey_nhl');
              sports.push('baseball_mlb_postseason');
            } else {
              /* NHL Sep-Jun */
              if (month >= 9 || month <= 6) {
                sports.push('icehockey_nhl');
                /* Period lines Nov-Jun */
                if (month >= 11 || month <= 6) {
                  sports.push('icehockey_nhl_1st_period_markets');
                  sports.push('icehockey_nhl_2nd_period_markets');
                }
              }
              /* MLB Apr-Sep regular season */
              if (month >= 4 && month <= 9)
                sports.push('baseball_mlb');
              /* NBA Oct 21 - Jun */
              if ((month === 10 && day >= 21) || month >= 12 || month <= 6)
                sports.push('basketball_nba');
              /* NFL Sep-Feb, game days Thu/Fri/Sat/Sun/Mon */
              if ((month >= 9 || month <= 2) && [0,1,4,5,6].includes(dow))
                sports.push('americanfootball_nfl');
              /* NCAAFB Sep-Jan, Thu/Fri/Sat */
              if ((month >= 9 || month === 1) && [4,5,6].includes(dow))
                sports.push('americanfootball_ncaaf');
              /* NCAAB Dec-Apr */
              if (month >= 12 || month <= 4)
                sports.push('basketball_ncaab');
              /* NCAA Baseball Feb-Jun */
              if (month >= 2 && month <= 6)
                sports.push('baseball_ncaa');
              /* PGA Tour Jan-Aug, Tue+Wed only */
              if ((month >= 1 && month <= 8) && [2,3].includes(dow))
                sports.push('golf_pga_tour');
            }
          }

          if (!sports.length) {
            console.log('No active sports — skipping');
            process.exit(0);
          }

          console.log('Fetch time:', d.toUTCString());
          console.log('Sports:', sports.join(', '));
          console.log('Credits this run:', sports.length);

          function patchGist(content) {
            return new Promise((res, rej) => {
              const body = JSON.stringify({ files: { 'odds.json': { content } } });
              const req = https.request({
                hostname: 'api.github.com',
                path: `/gists/${GIST_ID}`,
                method: 'PATCH',
                headers: {
                  'Authorization': `token ${GIST_TOKEN}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'pucks-picks-bot',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, r => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => res(r.statusCode));
              });
              req.on('error', rej);
              req.write(body);
              req.end();
            });
          }

          /* ══════════════════════════════════════════════════════
             HARD CREDIT CEILING
             Never go over 480 credits/month (leaves 20 buffer).
             Check remaining credits from API response headers
             before each fetch. Stop immediately if limit reached.
          ══════════════════════════════════════════════════════ */
          const MONTHLY_LIMIT = 500;
          const HARD_CEILING  = 480; /* stop fetching at 480 — 20 credit safety buffer */

          function getWithHeaders(url) {
            return new Promise((res, rej) => {
              https.get(url, { headers: { 'Accept': 'application/json' } }, r => {
                let body = '';
                r.on('data', c => body += c);
                r.on('end', () => {
                  try {
                    const remaining = parseInt(r.headers['x-requests-remaining'] || '-1', 10);
                    const used      = parseInt(r.headers['x-requests-used']      || '-1', 10);
                    res({ data: JSON.parse(body), remaining, used });
                  } catch(e) { rej(new Error('JSON parse error: ' + body.slice(0,100))); }
                });
              }).on('error', rej);
            });
          }

          async function main() {
            const allGames = [];
            const markets = 'h2h,spreads,totals';
            let creditsUsedSoFar = -1;

            for (const sport of sports) {
              try {
                /* Hard ceiling check: if we already know we're at or above limit, stop now */
                if (creditsUsedSoFar >= HARD_CEILING) {
                  console.log(`HARD CEILING HIT (${creditsUsedSoFar}/${MONTHLY_LIMIT}) — stopping all further fetches this run`);
                  break;
                }

                const url = `https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${ODDS_KEY}&regions=us&markets=${markets}&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm,caesars,betrivers,pointsbet,pinnacle`;
                const { data, remaining, used } = await getWithHeaders(url);

                /* Update running credit count from API response */
                if (used >= 0) creditsUsedSoFar = used;
                console.log(`${sport}: ${Array.isArray(data) ? data.length : '?'} games | credits used: ${used} | remaining: ${remaining}`);

                /* After this fetch, check if next fetch would exceed ceiling */
                if (used >= HARD_CEILING) {
                  console.log(`HARD CEILING REACHED (${used}/${MONTHLY_LIMIT}) — no more fetches this month`);
                  if (Array.isArray(data)) data.forEach(g => { g._sport = sport; allGames.push(g); });
                  break;
                }

                if (Array.isArray(data)) {
                  data.forEach(g => { g._sport = sport; allGames.push(g); });
                } else {
                  console.log(`${sport}: unexpected response`, JSON.stringify(data).slice(0,100));
                }
              } catch(e) {
                console.error(`${sport} failed:`, e.message);
              }
            }

            if (!allGames.length) {
              console.log('No games fetched — skipping Gist update');
              return;
            }

            const payload = JSON.stringify({
              updated: new Date().toISOString(),
              sports: sports,
              games: allGames
            });

            console.log(`Total games: ${allGames.length}`);
            console.log(`Payload size: ${(payload.length/1024).toFixed(1)}KB`);

            const status = await patchGist(payload);
            console.log(`Gist update status: ${status}`);
            if (status !== 200) {
              console.error('Gist update failed');
              process.exit(1);
            }
            console.log('Done!');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
