<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puck's Picks — Sharp Betting Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #F5B800;
      --gold-dim: #A37C00;
      --ice: #D4EDFF;
      --ice-dim: #8ABDD8;
      --dark1: #0A0E14;
      --dark2: #111720;
      --dark3: #1A2232;
      --dark4: #22304A;
      --green: #00C97B;
      --red: #FF4D5A;
      --text: #E8EDF4;
      --muted: #7A8FA8;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background: var(--dark1); color: var(--text); }
    .wrapper { background: var(--dark1); min-height: 100vh; padding-bottom: 2rem; }

    /* ── TICKER ── */
    .ticker-rail { background: var(--dark2); border-bottom: 1px solid var(--gold); overflow: hidden; height: 38px; position: relative; }
    .ticker-track { display: flex; gap: 0; white-space: nowrap; position: absolute; top: 0; left: 0; height: 100%; align-items: center; will-change: transform; }
    .ticker-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; border-right: 1px solid var(--border); height: 100%; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; }
    .ticker-teams { font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 1px; }
    .ticker-sep { color: var(--muted); font-size: 11px; }
    .ticker-fav { color: var(--gold); font-weight: 700; }
    .ticker-ou { color: var(--ice-dim); font-weight: 600; }
    .ticker-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.5; }

    /* ── HEADER ── */
    .header-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo-img { height: 58px; width: auto; display: block; }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .stat-pill { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; text-align: center; }
    .stat-pill .num { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--gold); }
    .stat-pill .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

    /* ── RECORD STRIPE ── */
    .record-stripe { display: flex; align-items: stretch; background: var(--dark2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .rec-item { flex: 1; text-align: center; padding: 10px 8px; border-right: 1px solid var(--border); }
    .rec-item:last-child { border-right: none; }
    .rec-num { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1; }
    .rec-num.w { color: var(--green); }
    .rec-num.l { color: var(--red); }
    .rec-num.t { color: var(--ice-dim); }
    .rec-num.pct { color: var(--gold); }
    .rec-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }

    /* ── STREAK BAR ── */
    .streak-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
    .streak-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .streak-pills { display: flex; gap: 5px; align-items: center; }
    .streak-pill { width: 28px; height: 28px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .streak-pill.W { background: rgba(0,201,123,0.2); color: var(--green); border: 1px solid rgba(0,201,123,0.4); }
    .streak-pill.L { background: rgba(255,77,90,0.2); color: var(--red); border: 1px solid rgba(255,77,90,0.4); }
    .streak-pill.T { background: rgba(138,189,216,0.2); color: var(--ice-dim); border: 1px solid rgba(138,189,216,0.4); }
    .streak-emoji { font-size: 22px; line-height: 1; }
    .streak-summary { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: var(--muted); margin-left: 4px; }

    /* ── BEST BET BANNER ── */
    .best-bet-banner { margin: 14px 20px 0; background: linear-gradient(135deg, rgba(245,184,0,0.15), rgba(245,184,0,0.04)); border: 1px solid var(--gold); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .bb-left { display: flex; align-items: center; gap: 12px; }
    .bb-badge { background: var(--gold); color: var(--dark1); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
    .bb-matchup { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--text); }
    .bb-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bb-pick { text-align: right; }
    .bb-pick-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 3px; }
    .bb-pick-val { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: var(--gold); letter-spacing: 1px; line-height: 1; }
    .bb-pick-odds { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── TABS ── */
    .league-tabs { display: flex; gap: 6px; padding: 16px 20px 0; overflow-x: auto; scrollbar-width: none; }
    .league-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: 7px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .tab-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .tab-btn.active { background: var(--gold); color: var(--dark1); border-color: var(--gold); }

    /* ── SECTION HEAD ── */
    .section-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px; }
    .section-head h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
    .section-head .badge { background: var(--gold); color: var(--dark1); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
    .section-head .badge.dim { background: var(--dark4); color: var(--muted); }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* ── GAME CARDS ── */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 0 20px; }

    .game-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.2s; cursor: pointer; }
    .game-card:hover { border-color: rgba(245,184,0,0.3); }

    .game-card-top { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
    .game-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sport-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; }
    .sport-tag.nhl  { background: rgba(212,237,255,0.12); color: var(--ice-dim); }
    .sport-tag.mlb  { background: rgba(0,201,123,0.12);   color: var(--green); }
    .sport-tag.nba  { background: rgba(245,184,0,0.12);   color: var(--gold); }
    .sport-tag.pga  { background: rgba(122,143,168,0.12); color: var(--muted); }
    .sport-tag.nfl  { background: rgba(255,77,90,0.12);   color: var(--red); }
    .sport-tag.ncaa { background: rgba(138,189,216,0.12); color: var(--ice-dim); }
    .game-time { font-size: 11px; color: var(--muted); }

    .matchup { display: flex; align-items: center; gap: 8px; }
    .team-col { flex: 1; }
    .team-abbr { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
    .team-name { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .at-sign { font-family: 'Barlow Condensed', sans-serif; color: var(--muted); font-size: 14px; }
    .team-col.away .team-abbr { color: var(--muted); }
    .team-col.home .team-abbr { color: var(--text); }

    .prob-bar { height: 3px; background: var(--dark4); margin: 0 16px 0; border-radius: 2px; overflow: hidden; }
    .prob-fill { height: 100%; background: var(--gold); border-radius: 2px; }

    .game-card-odds { display: flex; padding: 10px 16px; }
    .odds-block { flex: 1; text-align: center; padding: 8px 4px; border-radius: 6px; transition: background 0.15s; }
    .odds-block:hover { background: var(--dark3); }
    .odds-block + .odds-block { border-left: 1px solid var(--border); }
    .odds-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .odds-value { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
    .odds-value.fav { color: var(--gold); }
    .odds-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .puck-pick { display: flex; align-items: center; gap: 6px; padding: 7px 16px 9px; border-top: 1px solid rgba(245,184,0,0.18); }
    .pick-star { color: var(--gold); font-size: 12px; }
    .pick-text { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .pick-val { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold); }

    .no-games { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 13px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; }

    @media (max-width: 600px) {
      .header-right { gap: 6px; }
      .stat-pill { padding: 5px 9px; }
      .stat-pill .num { font-size: 15px; }
      .best-bet-banner { flex-direction: column; align-items: flex-start; }
      .bb-pick { text-align: left; }
    }
  </style>
</head>

<script>
  /* ── STREAK ── */
  const last10 = ['W','W','L','L','W','L','W','L','L','L'];
  const streakPillsEl = document.getElementById('streakPills');
  last10.forEach(r => {
    const d = document.createElement('div');
    d.className = 'streak-pill ' + r;
    d.textContent = r;
    streakPillsEl.appendChild(d);
  });
  const wins   = last10.filter(x => x === 'W').length;
  const losses = last10.filter(x => x === 'L').length;
  document.getElementById('streakSummary').textContent = wins + 'W - ' + losses + 'L';
  document.getElementById('streakEmoji').textContent = wins >= 5 ? '🔥' : losses >= 5 ? '🧊' : '😐';

  /* ── GAME DATA ── */
  const allGames = [
    { league:'NHL', away:'VAN', awayFull:'Canucks',   home:'COL', homeFull:'Avalanche', time:'8:30 PM ET', date:'today',    fav:'COL', favOdds:-470, ou:6.5, ouDir:'O', prob:80, pick:null,      pickOdds:null },
    { league:'NHL', away:'STL', awayFull:'Blues',     home:'LA',  homeFull:'Kings',     time:'9:00 PM ET', date:'today',    fav:'LA',  favOdds:-142, ou:5.5, ouDir:'O', prob:57, pick:'LA ML',   pickOdds:-142 },
    { league:'NHL', away:'ANA', awayFull:'Ducks',     home:'SJ',  homeFull:'Sharks',    time:'9:00 PM ET', date:'today',    fav:'ANA', favOdds:-115, ou:6.5, ouDir:'U', prob:50, pick:null,      pickOdds:null },
    { league:'NHL', away:'PIT', awayFull:'Penguins',  home:'TB',  homeFull:'Lightning', time:'7:00 PM ET', date:'tomorrow', fav:'TB',  favOdds:-170, ou:6.5, ouDir:'U', prob:61, pick:null,      pickOdds:null },
    { league:'NHL', away:'BUF', awayFull:'Sabres',    home:'OTT', homeFull:'Senators',  time:'7:00 PM ET', date:'tomorrow', fav:'OTT', favOdds:-125, ou:6.5, ouDir:'U', prob:52, pick:'OTT ML', pickOdds:-125 },
    { league:'NHL', away:'BOS', awayFull:'Bruins',    home:'FLA', homeFull:'Panthers',  time:'7:00 PM ET', date:'tomorrow', fav:'BOS', favOdds:-142, ou:6.5, ouDir:'U', prob:56, pick:'BOS ML', pickOdds:-142 },
    { league:'NHL', away:'MTL', awayFull:'Canadiens', home:'NYR', homeFull:'Rangers',   time:'7:00 PM ET', date:'tomorrow', fav:'MTL', favOdds:-135, ou:6.5, ouDir:'U', prob:57, pick:'MTL ML', pickOdds:-135 },
    { league:'NHL', away:'DET', awayFull:'Red Wings', home:'PHI', homeFull:'Flyers',    time:'7:00 PM ET', date:'tomorrow', fav:'PHI', favOdds:-115, ou:5.5, ouDir:'O', prob:51, pick:null,      pickOdds:null },
  ];

  function fmtOdds(n) { return n > 0 ? '+' + n : '' + n; }

  function showPick(odds) {
    if (odds === null) return false;
    if (odds < 0) return odds >= -150;
    return true;
  }

  const sportClassMap = { NHL:'nhl', MLB:'mlb', NBA:'nba', PGA:'pga', NFL:'nfl', NCAA:'ncaa' };

  function buildCard(g) {
    const hasPick = showPick(g.pickOdds);
    return `
      <div class="game-card">
        <div class="game-card-top">
          <div class="game-meta">
            <span class="sport-tag ${sportClassMap[g.league] || 'nhl'}">${g.league}</span>
            <span class="game-time">${g.time}</span>
          </div>
          <div class="matchup">
            <div class="team-col away"><div class="team-abbr">${g.away}</div><div class="team-name">${g.awayFull}</div></div>
            <div class="at-sign">@</div>
            <div class="team-col home"><div class="team-abbr">${g.home}</div><div class="team-name">${g.homeFull}</div></div>
          </div>
        </div>
        <div class="prob-bar"><div class="prob-fill" style="width:${g.prob}%"></div></div>
        <div class="game-card-odds">
          <div class="odds-block">
            <div class="odds-label">Fav / ML</div>
            <div class="odds-value fav">${g.fav}</div>
            <div class="odds-sub">${fmtOdds(g.favOdds)}</div>
          </div>
          <div class="odds-block">
            <div class="odds-label">O / U</div>
            <div class="odds-value">${g.ouDir} ${g.ou}</div>
            <div class="odds-sub">-110</div>
          </div>
          <div class="odds-block">
            <div class="odds-label">Win Prob</div>
            <div class="odds-value">${g.prob}%</div>
            <div class="odds-sub">${g.fav === g.home ? 'Home Fav' : 'Away Fav'}</div>
          </div>
        </div>
        ${hasPick ? `<div class="puck-pick"><span class="pick-star">★</span><span class="pick-text">Puck's Pick:</span><span class="pick-val">${g.pick} (${fmtOdds(g.pickOdds)})</span></div>` : ''}
      </div>`;
  }

  let currentLeague = 'ALL';
  function filterLeague(l, btn) {
    currentLeague = l;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const filtered = currentLeague === 'ALL' ? allGames : allGames.filter(g => g.league === currentLeague);
    const today    = filtered.filter(g => g.date === 'today');
    const upcoming = filtered.filter(g => g.date === 'tomorrow');
    document.getElementById('gamesGrid').innerHTML    = today.length    ? today.map(buildCard).join('')    : '<div class="no-games">No games on today\'s slate</div>';
    document.getElementById('upcomingGrid').innerHTML = upcoming.length ? upcoming.map(buildCard).join('') : '<div class="no-games">No upcoming games</div>';
  }
  render();

  /* ── TICKER ── */
  const tickerData = [
    {away:'VAN',home:'COL',fav:'COL',favOdds:-470,ou:'O/U 6.5'},
    {away:'STL',home:'LA', fav:'LA', favOdds:-142,ou:'O/U 5.5'},
    {away:'ANA',home:'SJ', fav:'ANA',favOdds:-115,ou:'O/U 6.5'},

    {away:'MTL',home:'NYR',fav:'MTL',favOdds:-135,ou:'O/U 6.5'},
    {away:'DET',home:'PHI',fav:'PHI',favOdds:-115,ou:'O/U 5.5'},
  ];
  const track = document.getElementById('tickerTrack');
  function mkItem(g) {
    const d = document.createElement('div');
    d.className = 'ticker-item';
    d.innerHTML = `<span class="ticker-teams">${g.away} @ ${g.home}</span><span class="ticker-sep">|</span><span class="ticker-fav">FAV: ${g.fav} ${fmtOdds(g.favOdds)}</span><span class="ticker-sep">|</span><span class="ticker-ou">${g.ou}</span><span class="ticker-dot"></span>`;
    return d;
