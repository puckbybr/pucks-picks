name: NHL Period Projections

on:
  schedule:
    - cron: '0 20 * * *'   # 4PM ET daily (20:00 UTC during EDT)
  workflow_dispatch:

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch NHL period stats and post projections to Discord
        run: |
          node << 'EOF'
          const https = require('https');

          const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1559318747242565765/Kyhzujiq6XG-BBpT9xlu9F083H3lQIWcYX8vgRhrz7uyzytXdtmMkLYN-Ngdph-ptU8e';

          function get(url) {
            return new Promise((res, rej) => {
              https.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/json'
                }
              }, r => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => {
                  try { res(JSON.parse(d)); }
                  catch(e) { rej(new Error('Parse error: ' + d.slice(0,100))); }
                });
              }).on('error', rej);
            });
          }

          function postDiscord(content) {
            return new Promise((res, rej) => {
              const body = JSON.stringify({ content });
              const url = new URL(DISCORD_WEBHOOK);
              const req = https.request({
                hostname: url.hostname,
                path: url.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, r => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => res(r.statusCode));
              });
              req.on('error', rej);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const etDate = new Date(Date.now() - 4 * 60 * 60 * 1000);
            const dateStr = etDate.toISOString().split('T')[0].replace(/-/g, '');
            const tomorrowStr = new Date(etDate.getTime() + 86400000)
              .toISOString().split('T')[0].replace(/-/g, '');
            const displayDate = etDate.toLocaleDateString('en-US', {
              weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });

            console.log('Fetching NHL period stats from NHL API...');

            /* Step 1: Fetch period goals stats from NHL official API
               Same data as NHL.com/stats/teams?report=goalsbyperiod
               Formula: (GF in period + GA in period) / GP */
            const statsUrl = 'https://api.nhle.com/stats/rest/en/team/goalsbyperiod' +
              '?cayenneExp=seasonId%3D20262027%20and%20gameTypeId%3D2' +
              '&sort=teamFullName&limit=50';

            const statsData = await get(statsUrl);
            const teams = statsData.data || [];

            if (!teams.length) {
              console.log('No stats data returned — using fallback rates');
            }

            /* Build period rates map: abbr → {p1, p2} */
            const RATES = {};
            const DEFAULT = { p1: 1.75, p2: 2.25 };

            teams.forEach(t => {
              const abbr = t.teamAbbrevs || t.teamCode || '';
              const gp = t.gamesPlayed || 1;

              /* Goals For + Goals Against in each period */
              const gfP1 = t.goalsForPeriod1 || t.p1Gf || 0;
              const gaP1 = t.goalsAgainstPeriod1 || t.p1Ga || 0;
              const gfP2 = t.goalsForPeriod2 || t.p2Gf || 0;
              const gaP2 = t.goalsAgainstPeriod2 || t.p2Ga || 0;

              if (abbr && gp > 0) {
                RATES[abbr.toUpperCase()] = {
                  p1: parseFloat(((gfP1 + gaP1) / gp).toFixed(3)),
                  p2: parseFloat(((gfP2 + gaP2) / gp).toFixed(3)),
                  gp: gp
                };
              }
            });

            const teamCount = Object.keys(RATES).length;
            console.log(`Loaded period rates for ${teamCount} teams`);

            /* Log sample rates for verification */
            if (RATES['EDM']) console.log('EDM rates:', RATES['EDM']);
            if (RATES['TOR']) console.log('TOR rates:', RATES['TOR']);

            /* Step 2: Fetch today + tomorrow NHL schedule from ESPN */
            const [todayData, tomorrowData] = await Promise.all([
              get(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${dateStr}`),
              get(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${tomorrowStr}`)
            ]);

            const events = [
              ...(todayData.events || []).map(e => ({ ...e, _day: 'Today' })),
              ...(tomorrowData.events || []).map(e => ({ ...e, _day: 'Tomorrow' }))
            ].filter(ev => {
              const s = ev.status && ev.status.type && ev.status.type.name;
              return s === 'STATUS_SCHEDULED' || s === 'STATUS_PRE_GAME';
            });

            if (!events.length) {
              await postDiscord(
                `🏒 **NHL Period Projections — ${displayDate}**\n\nNo upcoming NHL games today.`
              );
              return;
            }

            /* Step 3: Build Discord message */
            let msg = `🏒 **NHL Period Goal Projections**\n`;
            msg += `📅 ${displayDate}\n`;
            msg += `📊 *Formula: (GF + GA per period) ÷ GP, home + away averaged*\n`;
            msg += `📈 *Source: NHL.com ${teamCount} teams · 2026-27 season*\n\n`;

            events.forEach(ev => {
              const comp = ev.competitions && ev.competitions[0];
              if (!comp) return;
              const competitors = comp.competitors || [];
              const away = competitors.find(c => c.homeAway === 'away');
              const home = competitors.find(c => c.homeAway === 'home');
              if (!away || !home) return;

              const awayAbbr = (away.team && away.team.abbreviation || '').toUpperCase();
              const homeAbbr = (home.team && home.team.abbreviation || '').toUpperCase();
              const awayName = away.team && away.team.shortDisplayName || awayAbbr;
              const homeName = home.team && home.team.shortDisplayName || homeAbbr;

              const gameTime = new Date(ev.date).toLocaleTimeString('en-US', {
                hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'
              }) + ' ET';

              const awayR = RATES[awayAbbr] || DEFAULT;
              const homeR = RATES[homeAbbr] || DEFAULT;

              const p1 = ((awayR.p1 + homeR.p1) / 2).toFixed(2);
              const p2 = ((awayR.p2 + homeR.p2) / 2).toFixed(2);

              const dayTag = ev._day === 'Tomorrow' ? ' *(Tomorrow)*' : '';
              const noData = (!RATES[awayAbbr] || !RATES[homeAbbr]) ? ' ⚠️' : '';

              msg += `**${awayName} @ ${homeName}**${dayTag} · ${gameTime}${noData}\n`;
              msg += `> 1️⃣ 1st Period: **${p1}** goals projected\n`;
              msg += `> 2️⃣ 2nd Period: **${p2}** goals projected\n\n`;
            });

            msg += `_puckbybr.github.io/pucks-picks_`;

            /* Post — split if over 2000 chars */
            if (msg.length <= 2000) {
              const status = await postDiscord(msg);
              console.log('Discord status:', status);
            } else {
              const lines = msg.split('\n');
              let chunk = '';
              for (const line of lines) {
                if ((chunk + line + '\n').length > 1900) {
                  await postDiscord(chunk.trim());
                  await new Promise(r => setTimeout(r, 600));
                  chunk = line + '\n';
                } else {
                  chunk += line + '\n';
                }
              }
              if (chunk.trim()) await postDiscord(chunk.trim());
              console.log('Posted in multiple chunks');
            }
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
