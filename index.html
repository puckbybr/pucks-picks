<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puck's Picks — Sharp Betting Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #F5B800;
      --ice-dim: #8ABDD8;
      --dark1: #0A0E14;
      --dark2: #111720;
      --dark3: #1A2232;
      --dark4: #22304A;
      --green: #00C97B;
      --red: #FF4D5A;
      --amber: #FF9A00;
      --text: #E8EDF4;
      --muted: #7A8FA8;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background: var(--dark1); color: var(--text); }
    .wrapper { background: var(--dark1); min-height: 100vh; padding-bottom: 2rem; }

    /* TICKER */
    .ticker-rail { background: var(--dark2); border-bottom: 1px solid var(--gold); overflow: hidden; height: 38px; position: relative; }
    .ticker-track { display: flex; white-space: nowrap; position: absolute; top: 0; left: 0; height: 100%; align-items: center; }
    .ticker-item { display: inline-flex; align-items: center; gap: 7px; padding: 0 18px; border-right: 1px solid var(--border); height: 100%; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; }
    .ticker-teams { font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.8px; }
    .ticker-sep { color: var(--muted); font-size: 10px; }
    .ticker-score { font-weight: 900; font-size: 14px; letter-spacing: 1px; }
    .ticker-score.lead { color: var(--green); }
    .ticker-score.trail { color: var(--muted); }
    .ticker-clock { font-size: 11px; color: var(--amber); font-weight: 600; }
    .ticker-fav { color: var(--gold); font-weight: 700; }
    .ticker-ou { color: var(--ice-dim); font-weight: 600; }
    .ticker-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.5; flex-shrink: 0; }
    .ticker-live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: blink 1s infinite; }
    .ticker-section { border-right: 1px solid rgba(245,184,0,0.3); padding: 0 14px; height: 100%; display: inline-flex; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; background: rgba(245,184,0,0.1); color: var(--gold); }
    .ticker-section.live-hdr { background: rgba(255,77,90,0.1); color: var(--red); border-color: rgba(255,77,90,0.3); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* STATUS BAR */
    .status-bar { background: var(--dark3); border-bottom: 1px solid var(--border); padding: 5px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .status-left { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.offline { background: var(--red); }
    .status-dot.connecting { background: var(--amber); animation: blink 1s infinite; }
    .status-text { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }
    .status-text strong { color: var(--text); }
    .status-right { display: flex; align-items: center; gap: 10px; }
    .countdown { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: var(--muted); }
    .refresh-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; color: var(--muted); cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: all 0.15s; }
    .refresh-btn:hover { color: var(--gold); border-color: var(--gold); }
    .api-status-pill { border-radius: 4px; padding: 3px 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1px; }
    .api-status-pill.connected { background: rgba(0,201,123,0.12); color: var(--green); border: 1px solid rgba(0,201,123,0.3); }
    .api-status-pill.disconnected { background: rgba(255,154,0,0.12); color: var(--amber); border: 1px solid rgba(255,154,0,0.3); cursor: pointer; }

    /* HEADER */
    .header-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo-img { height: 58px; width: auto; display: block; }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .stat-pill { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; text-align: center; }
    .stat-pill .num { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--gold); }
    .stat-pill .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

    /* STREAK */
    .streak-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .streak-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .streak-pills { display: flex; gap: 5px; }
    .streak-pill { width: 28px; height: 28px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; }
    .streak-pill.W { background: rgba(0,201,123,0.2); color: var(--green); border: 1px solid rgba(0,201,123,0.4); }
    .streak-pill.L { background: rgba(255,77,90,0.2); color: var(--red); border: 1px solid rgba(255,77,90,0.4); }
    .streak-pill.T { background: rgba(138,189,216,0.2); color: var(--ice-dim); border: 1px solid rgba(138,189,216,0.4); }
    .streak-emoji { font-size: 22px; line-height: 1; }
    .streak-summary { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: var(--muted); margin-left: 4px; }

    /* BEST BET */
    .best-bet-banner { margin: 14px 20px 0; background: linear-gradient(135deg, rgba(245,184,0,0.15), rgba(245,184,0,0.04)); border: 1px solid var(--gold); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .bb-left { display: flex; align-items: center; gap: 12px; }
    .bb-badge { background: var(--gold); color: var(--dark1); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
    .bb-matchup { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); }
    .bb-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .bb-pick { text-align: right; }
    .bb-pick-label { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 3px; }
    .bb-pick-val { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: var(--gold); line-height: 1; }
    .bb-pick-odds { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* TABS */
    .league-tabs { display: flex; gap: 6px; padding: 16px 20px 0; overflow-x: auto; scrollbar-width: none; }
    .league-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: var(--dark3); border: 1px solid var(--border); border-radius: 6px; padding: 7px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .tab-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .tab-btn.active { background: var(--gold); color: var(--dark1); border-color: var(--gold); }

    /* SECTION */
    .section-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 10px; }
    .section-head h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
    .section-head .badge { background: var(--gold); color: var(--dark1); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
    .section-head .badge.dim { background: var(--dark4); color: var(--muted); }
    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* CARDS */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 0 20px; }
    .game-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color 0.2s; }
    .game-card:hover { border-color: rgba(245,184,0,0.3); }
    .game-card.live-card { border-color: rgba(255,77,90,0.35); }
    .game-card-top { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
    .game-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sport-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; }
    .sport-tag.nhl  { background: rgba(212,237,255,0.12); color: var(--ice-dim); }
    .sport-tag.mlb  { background: rgba(0,201,123,0.12);   color: var(--green); }
    .sport-tag.nba  { background: rgba(245,184,0,0.12);   color: var(--gold); }
    .sport-tag.pga  { background: rgba(122,143,168,0.12); color: var(--muted); }
    .sport-tag.nfl  { background: rgba(255,77,90,0.12);   color: var(--red); }
    .sport-tag.ncaa { background: rgba(138,189,216,0.12); color: var(--ice-dim); }
    .live-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,77,90,0.15); border: 1px solid rgba(255,77,90,0.4); border-radius: 3px; padding: 2px 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: var(--red); letter-spacing: 1px; }
    .live-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
    .game-time { font-size: 11px; color: var(--muted); }
    .matchup { display: flex; align-items: center; gap: 8px; }
    .team-col { flex: 1; }
    .team-abbr { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 1px; line-height: 1; }
    .team-name { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team-score { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; line-height: 1; margin-top: 2px; }
    .team-score.winning { color: var(--green); }
    .team-score.losing  { color: var(--muted); }
    .team-score.tied    { color: var(--text); }
    .at-sign { font-family: 'Barlow Condensed', sans-serif; color: var(--muted); font-size: 14px; }
    .team-col.away .team-abbr { color: var(--muted); }
    .team-col.home .team-abbr { color: var(--text); }
    .game-clock { text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; color: var(--amber); font-weight: 700; letter-spacing: 1px; margin-top: 6px; }
    .prob-bar { height: 3px; background: var(--dark4); margin: 0 16px; border-radius: 2px; overflow: hidden; }
    .prob-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s; }
    .game-card-odds { display: flex; padding: 10px 16px; }
    .odds-block { flex: 1; text-align: center; padding: 8px 4px; }
    .odds-block + .odds-block { border-left: 1px solid var(--border); }
    .odds-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .odds-value { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
    .odds-value.fav { color: var(--gold); }
    .odds-value.spread-val { color: var(--amber); font-size: 17px; }
    .odds-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .odds-sub.value-tag { color: var(--amber); font-weight: 600; }
    .puck-pick { display: flex; align-items: center; gap: 6px; padding: 7px 16px 9px; border-top: 1px solid rgba(245,184,0,0.18); }
    .pick-star { color: var(--gold); font-size: 12px; }
    .pick-text { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
    .pick-val { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold); }
    .no-games { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 13px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; }

    @media (max-width: 600px) {
      .header-right { gap: 6px; }
      .stat-pill { padding: 5px 8px; }
      .stat-pill .num { font-size: 14px; }
      .best-bet-banner { flex-direction: column; }
      .bb-pick { text-align: left; }
    }
  </style>
</head>

<script>
/* ══════════════════════════════════════════
   CONFIG — API key pre-loaded
   ══════════════════════════════════════════ */
const API_KEY        = '8f704d6437e1a8c264b58ae896ea0702';
const REFRESH_SEC    = 60;
const ML_THRESHOLD   = -200;
const SPORT_KEYS     = ['icehockey_nhl','baseball_mlb','basketball_nba'];
const SPORT_NAMES    = { icehockey_nhl:'NHL', baseball_mlb:'MLB', basketball_nba:'NBA' };

/* ── Puck's manually entered picks ── */
const BEST_BET = { matchup:'VAN @ MIN', sub:'NHL · Thu Apr 2 · 8:00 PM EDT', pick:'U 6.5', odds:-110 };
const PUCK_PICKS = [
  { away:'VAN', home:'MIN', pick:'U 6.5',  pickOdds:-110 },
  { away:'NSH', home:'LA',  pick:'LA ML',  pickOdds:-125 },
  { away:'NYM', home:'SF',  pick:'SF ML',  pickOdds:106  },
];

/* ══════════════════════════════════════════
   STATE
   ══════════════════════════════════════════ */
let liveGames = [], preGames = [];
let currentLeague = 'ALL';
let countdownSec  = REFRESH_SEC;
let countdownTimer;

/* ══════════════════════════════════════════

(function initStatic(){

  document.getElementById('streakEmoji').textContent=sw>=5?'🔥':sl>=5?'🧊':'😐';

  /* Best bet */

  document.getElementById('bbPickVal').textContent  = BEST_BET.pick;
  document.getElementById('bbPickOdds').textContent = fmtOdds(BEST_BET.odds)+' · Value Play';

  /* Date badges */

  const fmt = d => d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  document.getElementById('todayBadge').textContent    = fmt(now);
  document.getElementById('upcomingBadge').textContent = fmt(tmrw);
})();

/* ══════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════ */
function fmtOdds(n){ return n>0?'+'+n:''+n; }
function abbr(name){ return (name||'').split(' ').pop().substring(0,3).toUpperCase(); }
function showPick(o){ if(o===null||o===undefined) return false; return o<0?o>=-150:true; }
const scm = {NHL:'nhl',MLB:'mlb',NBA:'nba',PGA:'pga',NFL:'nfl',NCAA:'ncaa'};

function getPuckPick(awayA, homeA){
  return PUCK_PICKS.find(p => p.away===awayA && p.home===homeA) || null;
}

function spreadSuggest(league, favAbbr, favOdds){
  if(favOdds > ML_THRESHOLD) return null;
  const map = { NHL:{label:`${favAbbr} -1.5`,odds:-115}, MLB:{label:`${favAbbr} -1.5`,odds:-115}, NBA:{label:`${favAbbr} -5.5`,odds:-112} };
  return map[league] || null;
}

/* ══════════════════════════════════════════
   ODDS API FETCH
   ══════════════════════════════════════════ */
async function fetchSport(sport){
  const todayStr    = new Date().toISOString().split('T')[0];
  const tomorrowStr = new Date(Date.now()+86400000).toISOString().split('T')[0];
  const league      = SPORT_NAMES[sport];

  /* Scores — includes live & completed from last 24h */
  const scRes = await fetch(
    `https://api.the-odds-api.com/v4/sports/${sport}/scores/?apiKey=${API_KEY}&daysFrom=1`
  );
  if(!scRes.ok) throw new Error(`Scores ${sport}: ${scRes.status}`);
  const scores = await scRes.json();

  /* Odds — upcoming pre-game */
  const odRes = await fetch(
    `https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${API_KEY}&regions=us&markets=h2h,spreads,totals&oddsFormat=american`
  );
  const oddsArr = odRes.ok ? await odRes.json() : [];
  const oddsMap = {};
  oddsArr.forEach(g => { oddsMap[g.id] = g; });

  const live=[], pre=[];

  scores.forEach(g => {
    const gameDay = g.commence_time.split('T')[0];
    const isToday    = gameDay === todayStr;
    const isTomorrow = gameDay === tomorrowStr;
    if(!isToday && !isTomorrow) return;

    const awayA = abbr(g.away_team);
    const homeA = abbr(g.home_team);
    const timeStr = new Date(g.commence_time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
    const hasScores = g.scores && g.scores.length > 0;
    const status = g.completed ? 'final' : hasScores ? 'live' : 'pre';

    /* Extract market data */
    let favA='', favOdds=-110, ou='—', ouDir='O', suggestSpread=null;
    const od = oddsMap[g.id];
    if(od && od.bookmakers && od.bookmakers.length){
      const bk = od.bookmakers[0];
      const h2h    = bk.markets && bk.markets.find(m=>m.key==='h2h');
      const totals = bk.markets && bk.markets.find(m=>m.key==='totals');
      if(h2h && h2h.outcomes && h2h.outcomes.length===2){
        const [o1,o2] = h2h.outcomes;
        const isFav1 = o1.price <= o2.price;
        favA     = abbr(isFav1 ? o1.name : o2.name);
        favOdds  = isFav1 ? o1.price : o2.price;
        suggestSpread = spreadSuggest(league, favA, favOdds);
      }
      if(totals && totals.outcomes && totals.outcomes.length){
        const ov = totals.outcomes.find(o=>o.name==='Over');
        if(ov){ ou = ov.point; ouDir='O'; }
      }
    } else {
      favA = homeA; /* default home as fav if no odds yet */
    }

    const pp = isToday ? getPuckPick(awayA, homeA) : null;
    const prob = Math.round(Math.abs(favOdds)/(Math.abs(favOdds)+100)*100);

    const awayScore = hasScores ? (g.scores.find(s=>abbr(s.name)===awayA)||{score:null}).score : null;
    const homeScore = hasScores ? (g.scores.find(s=>abbr(s.name)===homeA)||{score:null}).score : null;

    const obj = {
      league, away:awayA, awayFull:g.away_team, home:homeA, homeFull:g.home_team,
      time:timeStr, date:isToday?'today':'tomorrow', status,
      fav:favA, favOdds, ou, ouDir, prob,
      pick:pp?pp.pick:null, pickOdds:pp?pp.pickOdds:null,
      spreadSuggest:suggestSpread,
      awayScore, homeScore,
      clock: g.completed ? 'Final' : hasScores ? 'Live' : null,
    };

    if(status==='pre') pre.push(obj);
    else if(status==='live'||status==='final') live.push(obj);
  });

  return { live, pre };
}

async function fetchAll(){
  const live=[], pre=[];
  for(const sport of SPORT_KEYS){
    try {
      const r = await fetchSport(sport);
      live.push(...r.live);
      pre.push(...r.pre);
    } catch(e){ console.warn('Fetch error:', e.message); }
  }
  return { live, pre };
}

/* ══════════════════════════════════════════
   CARD BUILDER
   ══════════════════════════════════════════ */
function buildCard(g){
  const hp = showPick(g.pickOdds);
  const isLive = g.status==='live' || g.status==='final';
  const ouLabel = g.league==='NBA' ? `${g.ouDir} ${g.ou} pts` : `${g.ouDir} ${g.ou}`;
  const awayS = g.awayScore !== null ? parseInt(g.awayScore) : null;
  const homeS = g.homeScore !== null ? parseInt(g.homeScore) : null;
  const awayWin = awayS!==null && homeS!==null && awayS>homeS;
  const homeWin = awayS!==null && homeS!==null && homeS>awayS;

  const metaRight = isLive
    ? `<span class="live-badge"><span class="live-badge-dot"></span>${g.status==='final'?'FINAL':'LIVE'}</span>`
    : `<span class="game-time">${g.time}</span>`;

  const awayScoreEl = isLive && awayS!==null ? `<div class="team-score ${awayWin?'winning':homeWin?'losing':'tied'}">${awayS}</div>` : '';
  const homeScoreEl = isLive && homeS!==null ? `<div class="team-score ${homeWin?'winning':awayWin?'losing':'tied'}">${homeS}</div>` : '';
  const clockEl     = isLive && g.clock ? `<div class="game-clock">${g.clock}</div>` : '';

  let favBlock;
  if(g.spreadSuggest){
    favBlock = `<div class="odds-block"><div class="odds-label">Spread (Value)</div><div class="odds-value spread-val">${g.spreadSuggest.label}</div><div class="odds-sub value-tag">${fmtOdds(g.spreadSuggest.odds)} · Better Value</div></div>`;
  } else {
    favBlock = `<div class="odds-block"><div class="odds-label">Fav / ML</div><div class="odds-value fav">${g.fav}</div><div class="odds-sub">${fmtOdds(g.favOdds)}</div></div>`;
  }

  return `<div class="game-card${isLive?' live-card':''}">
    <div class="game-card-top">
      <div class="game-meta"><span class="sport-tag ${scm[g.league]||'nhl'}">${g.league}</span>${metaRight}</div>
      <div class="matchup">
        <div class="team-col away"><div class="team-abbr">${g.away}</div><div class="team-name">${g.awayFull}</div>${awayScoreEl}</div>
        <div class="at-sign">@</div>
        <div class="team-col home"><div class="team-abbr">${g.home}</div><div class="team-name">${g.homeFull}</div>${homeScoreEl}</div>
      </div>${clockEl}
    </div>
    <div class="prob-bar"><div class="prob-fill" style="width:${g.prob}%"></div></div>
    <div class="game-card-odds">
      ${favBlock}
      <div class="odds-block"><div class="odds-label">O / U</div><div class="odds-value">${ouLabel}</div><div class="odds-sub">-110</div></div>
      <div class="odds-block"><div class="odds-label">Win Prob</div><div class="odds-value">${g.prob}%</div><div class="odds-sub">${g.fav===g.home?'Home Fav':'Away Fav'}</div></div>
    </div>
    ${hp?`<div class="puck-pick"><span class="pick-star">★</span><span class="pick-text">Puck's Pick:</span><span class="pick-val">${g.pick} (${fmtOdds(g.pickOdds)})</span></div>`:''}
  </div>`; }

/* ══════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════ */
function render(){
  const all = [...liveGames,...preGames];
  const f   = currentLeague==='ALL' ? all : all.filter(g=>g.league===currentLeague);
  const todayAll  = f.filter(g=>g.date==='today');
  const upcoming  = f.filter(g=>g.date==='tomorrow' && g.status==='pre');
  document.getElementById('gamesGrid').innerHTML    = todayAll.length  ? todayAll.map(buildCard).join('')  : '<div class="no-games">No matchups available</div>';
  document.getElementById('upcomingGrid').innerHTML = upcoming.length  ? upcoming.map(buildCard).join('')  : '<div class="no-games">No upcoming games</div>';
  const pending = preGames.filter(g=>g.date==='today'&&g.pick!==null&&showPick(g.pickOdds)).length;
  document.getElementById('pendingNum').textContent = pending;
}

function filterLeague(l, btn){
  currentLeague=l;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

/* ══════════════════════════════════════════
   TICKER
   ══════════════════════════════════════════ */
function buildTicker(){
  cancelAnimationFrame(tickerAnim);
  tickerPos=0;
  const track = document.getElementById('tickerTrack');
  track.style.transform='translateX(0)';
  track.innerHTML='';

  function mkSec(label,live){ const d=document.createElement('div'); d.className='ticker-section'+(live?' live-hdr':''); d.textContent=label; return d; }
  function mkLive(g){
    const d=document.createElement('div'); d.className='ticker-item';
    const aS=parseInt(g.awayScore||0),hS=parseInt(g.homeScore||0);
    d.innerHTML=`<span class="ticker-live-dot"></span><span class="ticker-teams">${g.away}</span><span class="ticker-score ${aS>hS?'lead':'trail'}">${aS}</span><span class="ticker-sep">—</span><span class="ticker-score ${hS>aS?'lead':'trail'}">${hS}</span><span class="ticker-teams">${g.home}</span><span class="ticker-sep">|</span><span class="ticker-clock">${g.clock||'Live'}</span><span class="ticker-dot"></span>`;
    return d;
  }
  function mkPre(g){
    const d=document.createElement('div'); d.className='ticker-item';
    d.innerHTML=`<span class="ticker-teams">${g.away} @ ${g.home}</span><span class="ticker-sep">|</span><span class="ticker-fav">FAV: ${g.fav} ${fmtOdds(g.favOdds)}</span><span class="ticker-sep">|</span><span class="ticker-ou">O/U ${g.ou}</span><span class="ticker-dot"></span>`;
    return d;
  }

  function addContent(){
    if(liveGames.length){ track.appendChild(mkSec('🔴 Live Scores',true)); liveGames.forEach(g=>track.appendChild(mkLive(g))); }
    const tp=preGames.filter(g=>g.date==='today');
    if(tp.length){ track.appendChild(mkSec('📋 Pre-Game Odds',false)); tp.forEach(g=>track.appendChild(mkPre(g))); }
  }
  addContent(); addContent();

  if(!track.children.length) return;
  requestAnimationFrame(function scroll(){
    const w=track.scrollWidth/2;
    if(w<=0){ tickerAnim=requestAnimationFrame(scroll); return; }
    tickerPos+=0.6;
    if(tickerPos>=w) tickerPos=0;
    track.style.transform=`translateX(-${tickerPos}px)`;
    tickerAnim=requestAnimationFrame(scroll);
  });
}

/* ══════════════════════════════════════════
   STATUS
   ══════════════════════════════════════════ */
function setStatus(state, msg){
  document.getElementById('statusDot').className = 'status-dot'+(state==='live'?'':state==='connecting'?' connecting':' offline');
  document.getElementById('statusText').innerHTML = msg;
}

/* ══════════════════════════════════════════
   COUNTDOWN (Option C — 60s auto-refresh)
   ══════════════════════════════════════════ */
function startCountdown(){
  clearInterval(countdownTimer);
  countdownSec=REFRESH_SEC;
  updateCD();
  countdownTimer=setInterval(()=>{
    countdownSec--;
    updateCD();
    if(countdownSec<=0) refreshAll();
  },1000);
}
function updateCD(){ document.getElementById('countdown').textContent=`Refreshes in ${countdownSec}s`; }

/* ══════════════════════════════════════════
   MAIN REFRESH
   ══════════════════════════════════════════ */
async function refreshAll(){
  setStatus('connecting','Fetching live data...');
  try {
    const data = await fetchAll();
    liveGames = data.live;
    preGames  = data.pre;
    const t = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    setStatus('live',`Live data · Updated <strong>${t}</strong>`);
  } catch(e){
    setStatus('offline','Connection error — retrying next cycle');
    console.error(e);
  }
  render();
  buildTicker();
  startCountdown();
}

/* ══════════════════════════════════════════
   GO
   ══════════════════════════════════════════ */
refreshAll();
</script>
