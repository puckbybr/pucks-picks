name: Fetch Odds

on:
  schedule:
    # CORE: 2 fetches daily (11AM ET + 4PM ET) — all sports year-round
    - cron: '0 16 * * *'     # 11AM ET — morning lines
    - cron: '0 21 * * *'     # 4PM ET  — evening update

    # SATURDAY 9AM ET — before noon NCAAFB kickoffs (Sep-Jan only, handled in script)
    - cron: '0 13 * * 6'

    # SUNDAY 10AM ET — before 1PM NFL kickoffs (Sep-Feb only, handled in script)
    - cron: '0 14 * * 0'

  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch odds and save to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node << 'EOF'
          const https = require('https');

          const ODDS_KEY   = '3b6575443e2403327658322a07460ebc';
          const GIST_ID    = 'aa152fd88a987e42a009b7a5686690a1';
          const GIST_TOKEN = process.env.GIST_TOKEN;

          const d     = new Date();
          const month = d.getUTCMonth() + 1;
          const day   = d.getUTCDate();
          const dow   = d.getUTCDay();
          const hour  = d.getUTCHours();

          const sports = [];

          /* Skip duplicate weekend fetches outside NFL/NCAAFB season
             Sat 9AM (hour=13) and Sun 10AM (hour=14) only add value Sep-Feb */
          const isWeekendExtra = (dow === 6 && hour === 13) || (dow === 0 && hour === 14);
          const nflNcaafbActive = (month >= 9 || month <= 2);
          if (isWeekendExtra && !nflNcaafbActive) {
            console.log('Skipping weekend extra fetch — NFL/NCAAFB not active');
            process.exit(0);
          }

          /* OCTOBER CONSERVATION: NHL + MLB postseason only */
          if (month === 10) {
            sports.push('icehockey_nhl');
            /* MLB postseason handled in Nov block below */
          } else {
            /* NHL Sep-Jun */
            if (month >= 9 || month <= 6) {
              sports.push('icehockey_nhl');
              /* Period lines Nov-Jun */
              if (month >= 11 || month <= 6) {
                sports.push('icehockey_nhl_1st_period_markets');
                sports.push('icehockey_nhl_2nd_period_markets');
              }
            }
            /* MLB Apr-Nov: regular season Apr-Sep + postseason Oct-Nov */
            if (month >= 4 && month <= 11 && hour === 15)
              sports.push('baseball_mlb');
            /* MLB postseason included in Apr-Nov range above */
            /* NBA Oct 21 - Jun */
            if ((month === 10 && day >= 21) || month >= 11 || month <= 6)
              sports.push('basketball_nba');
            /* NFL Sep-Feb, game days Thu/Fri/Sat/Sun/Mon */
            if ((month >= 9 || month <= 2) && [0,1,4,5,6].includes(dow))
              sports.push('americanfootball_nfl');
            /* NCAAFB Sep-Jan, Thu/Fri/Sat */
            if ((month >= 9 || month === 1) && [4,5,6].includes(dow))
              sports.push('americanfootball_ncaaf');
            /* NCAAB Nov-Apr */
            if (month >= 11 || month <= 4)
              sports.push('basketball_ncaab');

            /* NCAA CB (College Baseball) Feb-Jun */
            if (month >= 2 && month <= 6)
              sports.push('baseball_ncaa');

            /* PGA Tour Jan-Aug, Tuesday+Wednesday only (lines open midweek)
               Top 20 finisher props + outright winner markets */
            if ((month >= 1 && month <= 8) && [2,3].includes(dow))
              sports.push('golf_pga_tour');
          }

          if (!sports.length) {
            console.log('No active sports — skipping');
            process.exit(0);
          }

          console.log('Fetch time:', d.toUTCString());
          console.log('Sports:', sports.join(', '));
          console.log('Credits this run:', sports.length);

          function get(url) {
            return new Promise((res, rej) => {
              https.get(url, { headers: { 'Accept': 'application/json' } }, r => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => {
                  try { res(JSON.parse(d)); }
                  catch(e) { rej(new Error('JSON parse error: ' + d.slice(0,100))); }
                });
              }).on('error', rej);
            });
          }

          function patchGist(content) {
            return new Promise((res, rej) => {
              const body = JSON.stringify({ files: { 'odds.json': { content } } });
              const req = https.request({
                hostname: 'api.github.com',
                path: `/gists/${GIST_ID}`,
                method: 'PATCH',
                headers: {
                  'Authorization': `token ${GIST_TOKEN}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'pucks-picks-bot',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, r => {
                let d = '';
                r.on('data', c => d += c);
                r.on('end', () => res(r.statusCode));
              });
              req.on('error', rej);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const allGames = [];
            const markets = 'h2h,spreads,totals';

            for (const sport of sports) {
              try {
                const url = `https://api.the-odds-api.com/v4/sports/${sport}/odds/?apiKey=${ODDS_KEY}&regions=us&markets=${markets}&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm,caesars,betrivers,pointsbet,pinnacle`;
                const data = await get(url);
                if (Array.isArray(data)) {
                  console.log(`${sport}: ${data.length} games`);
                  data.forEach(g => { g._sport = sport; allGames.push(g); });
                } else {
                  console.log(`${sport}: unexpected response`, JSON.stringify(data).slice(0,100));
                }
              } catch(e) {
                console.error(`${sport} failed:`, e.message);
              }
            }

            const payload = JSON.stringify({
              updated: new Date().toISOString(),
              sports: sports,
              games: allGames
            });

            console.log(`Total games: ${allGames.length}`);
            console.log(`Payload size: ${(payload.length/1024).toFixed(1)}KB`);

            const status = await patchGist(payload);
            console.log(`Gist update status: ${status}`);
            if (status !== 200) {
              console.error('Gist update failed');
              process.exit(1);
            }
            console.log('Done!');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
